[package]
name = "outil-update"
version = "1.2.44"
description = "Hardware diagnostic and configuration utility (Tauri + Rust)"
authors = ["Hardware Workshop"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winreg = "0.52"
